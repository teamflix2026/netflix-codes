<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Último correo de Netflix</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #141414;
      color: #fff;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 800px; }
    h1 { color: #e50914; margin-top: 0; }
    button {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #f6121d; }
    button:disabled { background: #666; cursor: not-allowed; }
    #info {
      margin: 16px 0 8px;
      font-size: 14px;
      color: #bbb;
      line-height: 1.6;
    }
    #status { margin-top: 12px; font-size: 14px; color: #f5c518; }
    textarea {
      width: 100%;
      height: 420px;
      margin-top: 8px;
      padding: 12px;
      font-size: 14px;
      font-family: Consolas, monospace;
      background: #1f1f1f;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Último correo de Netflix</h1>
    <button id="btnBuscar">Buscar</button>
    <div id="status"></div>
    <div id="info"></div>
    <textarea id="contenido" readonly placeholder="Aquí aparecerá el contenido del correo..."></textarea>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // ====== CONFIGURACIÓN ======
    const CLIENT_ID = "TU_CLIENT_ID_AQUI";
    const SCOPES = "https://www.googleapis.com/auth/gmail.readonly";
    const QUERY = "from:netflix"; // puedes cambiarlo, ej: "from:info@account.netflix.com"
    // ===========================

    let tokenClient = null;
    let accessToken = null;

    const btn = document.getElementById("btnBuscar");
    const statusEl = document.getElementById("status");
    const infoEl = document.getElementById("info");
    const textarea = document.getElementById("contenido");

    function setStatus(msg) { statusEl.textContent = msg; }

    function initTokenClient() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) {
            setStatus("Error de autorización: " + resp.error);
            btn.disabled = false;
            return;
          }
          accessToken = resp.access_token;
          buscarUltimoCorreo();
        }
      });
    }

    btn.addEventListener("click", () => {
      if (!tokenClient) {
        if (window.google && google.accounts) {
          initTokenClient();
        } else {
          setStatus("Aún se está cargando Google, intenta de nuevo en un momento.");
          return;
        }
      }
      btn.disabled = true;
      textarea.value = "";
      infoEl.textContent = "";
      if (accessToken) {
        buscarUltimoCorreo();
      } else {
        setStatus("Solicitando permiso a Google...");
        tokenClient.requestAccessToken({ prompt: "" });
      }
    });

    async function gmailFetch(url) {
      const res = await fetch(url, {
        headers: { Authorization: "Bearer " + accessToken }
      });
      if (res.status === 401) {
        accessToken = null; // token vencido
        throw new Error("La sesión venció. Presiona Buscar de nuevo.");
      }
      if (!res.ok) {
        throw new Error("Error de Gmail API (" + res.status + ")");
      }
      return res.json();
    }

    async function buscarUltimoCorreo() {
      try {
        setStatus("Buscando el último correo de Netflix...");
        const base = "https://gmail.googleapis.com/gmail/v1/users/me/messages";

        const lista = await gmailFetch(
          base + "?maxResults=1&q=" + encodeURIComponent(QUERY)
        );

        if (!lista.messages || lista.messages.length === 0) {
          setStatus("No se encontraron correos de Netflix.");
          return;
        }

        const msg = await gmailFetch(base + "/" + lista.messages[0].id + "?format=full");

        const headers = msg.payload.headers || [];
        const getHeader = (name) => {
          const h = headers.find(x => x.name.toLowerCase() === name.toLowerCase());
          return h ? h.value : "";
        };

        infoEl.innerHTML =
          "<b>De:</b> " + escapeHtml(getHeader("From")) + "<br>" +
          "<b>Asunto:</b> " + escapeHtml(getHeader("Subject")) + "<br>" +
          "<b>Fecha:</b> " + escapeHtml(getHeader("Date"));

        textarea.value = extraerCuerpo(msg.payload) || "(El correo no tiene contenido de texto)";
        setStatus("Listo ✔");
      } catch (err) {
        setStatus(err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- Utilidades ----------
    function decodeBase64Url(data) {
      const b64 = data.replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(b64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function buscarParte(payload, mimeType) {
      if (payload.mimeType === mimeType && payload.body && payload.body.data) {
        return payload.body.data;
      }
      if (payload.parts) {
        for (const p of payload.parts) {
          const r = buscarParte(p, mimeType);
          if (r) return r;
        }
      }
      return null;
    }

    function extraerCuerpo(payload) {
      const plano = buscarParte(payload, "text/plain");
      if (plano) return decodeBase64Url(plano);

      const html = buscarParte(payload, "text/html");
      if (html) {
        const doc = new DOMParser().parseFromString(decodeBase64Url(html), "text/html");
        doc.querySelectorAll("style, script").forEach(el => el.remove());
        return (doc.body.textContent || "").replace(/\n\s*\n\s*\n+/g, "\n\n").trim();
      }
      return "";
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
  </script>
</body>
</html>
